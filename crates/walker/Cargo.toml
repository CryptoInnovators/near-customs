[package]
name = "customs-walker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "customs_walker"
path = "src/lib.rs"

[[bin]]
name = "customs-walker"
path = "src/main.rs"

[dependencies]
customs-common = { path = "../common" }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
sha2 = "0.10"
