[package]
name = "customs-walker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "customs_walker"
path = "src/lib.rs"

[[bin]]
name = "customs-walker"
path = "src/main.rs"
required-features = ["net"]

[features]
default = ["net"]
# The on-disk cached FastNEAR client and the CLI. Off for the WASI checker, which reads chain facts through the host's HTTP.
net = ["dep:ureq", "dep:sha2"]

[dependencies]
customs-common = { path = "../common" }
ureq = { version = "2", features = ["json"], optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
