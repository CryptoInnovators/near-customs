[package]
name = "customs-token"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Test builds only: skips the published-judge check in `new` so the sandbox can deploy OutLayer beside the token
# and run its own checker build. The wasm that ships is built without it.
sandbox = []
testnet = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
customs-common = { path = "../../crates/common" }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.16.0-rust-1.86.0"
image_digest = "sha256:3220302ebb7036c1942e772810f21edd9381edf9a339983da43487c77fbad488"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"
