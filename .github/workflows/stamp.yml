name: stamp
on:
  push:
    branches: [main]
    paths: ["contracts/stamp/**", "crates/common/**", ".github/workflows/stamp.yml"]
  workflow_dispatch:
jobs:
  stamp:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts/stamp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/stamp
      - name: unit tests
        run: cargo test
      - name: build the stamp wasm
        run: RUSTFLAGS='--cfg near -C link-arg=-s' cargo build --target wasm32-unknown-unknown --release
      - name: hash
        run: sha256sum target/wasm32-unknown-unknown/release/customs_stamp.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: customs-stamp
          path: |
            contracts/stamp/target/wasm32-unknown-unknown/release/customs_stamp.wasm
            contracts/stamp/Cargo.lock
