[package]
name = "customs-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"
ed25519-dalek = "2"
customs-common = { path = "../crates/common" }
customs-checker = { path = "../crates/checker" }
customs-walker = { path = "../crates/walker", default-features = false }
